# Local development database: Microsoft SQL Server 2022 (Developer edition).
# Start:  docker compose up -d
# Stop:   docker compose down      (data is kept in the "mssql-data" volume)
# Reset:  docker compose down -v   (removes the volume = deletes all data)
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: todoapp-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      # Local development password only. Never commit real secrets.
      MSSQL_SA_PASSWORD: "TodoApp_Dev_123!"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  mssql-data:
