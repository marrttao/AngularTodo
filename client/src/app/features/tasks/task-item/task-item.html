<div
  class="group flex cursor-pointer items-center gap-3 rounded-md bg-white px-4 py-3 shadow-sm transition hover:bg-gray-50"
  [class.ring-2]="selected()"
  [class.ring-brand]="selected()"
  (click)="open.emit(task())"
>
  <!-- $event.stopPropagation(): clicking the circle must not also open the details panel -->
  <button
    type="button"
    class="flex h-5 w-5 shrink-0 items-center justify-center rounded-full border-2 transition"
    [class]="task().isCompleted ? 'border-brand bg-brand text-white' : 'border-gray-400 text-transparent hover:text-gray-400'"
    [attr.aria-label]="task().isCompleted ? 'Mark as not completed' : 'Mark as completed'"
    (click)="$event.stopPropagation(); toggle.emit(task())"
  >
    <svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
    </svg>
  </button>

  <div class="min-w-0 flex-1">
    <p class="truncate text-sm" [class.line-through]="task().isCompleted" [class.text-gray-400]="task().isCompleted">
      {{ task().title }}
    </p>

    @if (task().categoryName || task().dueDate || task().description) {
      <div class="mt-0.5 flex flex-wrap items-center gap-x-2 text-xs text-gray-500">
        @if (task().categoryName) {
          <span>{{ task().categoryName }}</span>
        }
        @if (task().dueDate) {
          <span class="flex items-center gap-1" [class.text-red-600]="isOverdue()">
            <svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            {{ task().dueDate | date: 'EEE, MMM d' }}
          </span>
        }
        @if (task().description) {
          <span class="flex items-center gap-1" title="Has notes">
            <svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h10" />
            </svg>
            Note
          </span>
        }
      </div>
    }
  </div>

  <button
    type="button"
    class="rounded p-1 text-gray-400 opacity-0 transition group-hover:opacity-100 hover:bg-red-50 hover:text-red-600"
    aria-label="Delete task"
    (click)="$event.stopPropagation(); remove.emit(task())"
  >
    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
    </svg>
  </button>
</div>
