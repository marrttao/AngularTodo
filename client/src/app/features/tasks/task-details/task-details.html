<aside class="flex h-full w-full flex-col border-l border-gray-200 bg-[#f3f2f1] md:w-80">
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="flex flex-1 flex-col gap-4 overflow-y-auto p-4">
    <div class="flex items-center justify-between">
      <h2 class="text-sm font-semibold text-gray-600">Task details</h2>
      <button type="button" class="rounded p-1 text-gray-500 hover:bg-gray-200" aria-label="Close" (click)="close.emit()">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="rounded-md bg-white p-3 shadow-sm">
      <label class="mb-2 flex items-center gap-2 text-sm">
        <input type="checkbox" formControlName="isCompleted" class="h-4 w-4 accent-brand" />
        Completed
      </label>
      <input type="text" formControlName="title" class="input font-medium" placeholder="Title" aria-label="Title" />
      @if (form.controls.title.touched && form.controls.title.invalid) {
        <p class="field-error">Title is required (max 200 characters).</p>
      }
    </div>

    <div class="space-y-3 rounded-md bg-white p-3 shadow-sm">
      <div>
        <label for="dueDate" class="mb-1 block text-xs font-medium text-gray-500">Due date</label>
        <input id="dueDate" type="date" formControlName="dueDate" class="input" />
      </div>

      <div>
        <label for="category" class="mb-1 block text-xs font-medium text-gray-500">Category</label>
        <!-- [ngValue] keeps the real value type (number or null) instead of a string -->
        <select id="category" formControlName="categoryId" class="input">
          <option [ngValue]="null">No category</option>
          @for (category of categories(); track category.id) {
            <option [ngValue]="category.id">{{ category.name }}</option>
          }
        </select>
      </div>
    </div>

    <div class="rounded-md bg-white p-3 shadow-sm">
      <label for="description" class="mb-1 block text-xs font-medium text-gray-500">Note</label>
      <textarea
        id="description"
        formControlName="description"
        rows="5"
        class="input resize-none"
        placeholder="Add note"
      ></textarea>
      @if (form.controls.description.invalid) {
        <p class="field-error">Note is too long (max 2000 characters).</p>
      }
    </div>

    <div class="mt-auto flex gap-2">
      <button type="submit" class="btn-primary flex-1" [disabled]="saving() || form.pristine">
        {{ saving() ? 'Saving...' : 'Save' }}
      </button>
      <button type="button" class="btn-secondary text-red-600 hover:bg-red-50" (click)="remove.emit(task())">
        Delete
      </button>
    </div>

    <p class="text-center text-xs text-gray-500">Created {{ task().createdAt | date: 'MMM d, y, HH:mm' }}</p>
  </form>
</aside>
